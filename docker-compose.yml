services:
  # ---------- MySQL 数据库 ----------
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "454520"
      MYSQL_DATABASE: school
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时自动执行：建表 + 灌入示例数据
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p454520"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 故意不映射到宿主机端口：避免和你本地 MySQL(3306) 冲突
    # 容器之间用服务名访问：mysql:3306

  # ---------- Redis 缓存 ----------
  redis:
    image: redis:7-alpine
    # 同样不映射到宿主机端口：避免和本地 Redis 冲突
    # 容器之间用服务名访问：redis:6379

  # ---------- FastAPI 应用 ----------
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: root
      DB_PASSWORD: "454520"
      DB_NAME: school
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  mysql_data:
